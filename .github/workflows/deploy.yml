# Rolt de app uit naar GitHub Pages en zet daarbij config.js in elkaar uit
# repository-variabelen en -secrets, zodat die niet in de repo hoeven te staan.
#
# Eenmalig instellen:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions:
#     Variables: SUPABASE_URL              = https://<project-id>.supabase.co
#     Secrets:   SUPABASE_PUBLISHABLE_KEY  = de publiceerbare (anon) sleutel
#
# Let op: config.js wordt aan de browser geserveerd. Wat hier in gaat is dus
# publiek leesbaar — daarom uitsluitend de publiceerbare sleutel. De geheime
# sleutel (sb_secret_…) hoort hier nooit; de workflow weigert die ook.

name: Uitrollen naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node tests/run.js

      - name: Site samenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js fonts icons decks _site/

      - name: config.js schrijven
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/write-config.mjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  uitrollen:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
