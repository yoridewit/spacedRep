# Draait de tests bij elke push. Uitrollen doet Vercel zelf (zie vercel.json);
# deze workflow raakt de site niet aan.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/run.js
